services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: fincore
      MYSQL_USER: fincore
      MYSQL_PASSWORD: fincore
      MYSQL_ROOT_PASSWORD: localroot
    ports:
      - "3307:3306"
    volumes:
      - fincore_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  fincore_mysql:
