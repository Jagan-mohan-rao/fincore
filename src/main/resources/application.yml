server:
  port: ${PORT:8080}
spring:
  config:
    import: optional:file:.env[.properties]
  application.name: fincore
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3307/fincore?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:fincore}
    password: ${DB_PASSWORD:fincore}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
app:
  jwt:
    secret: ${JWT_SECRET:local-dev-secret-change-this-to-a-long-random-value-32chars}
    expiration: ${JWT_EXPIRATION:PT8H}
