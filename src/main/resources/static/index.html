<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f7f4"><title>FinCore — Your money, in sync</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div id="app"></div>
  <dialog id="action-dialog"><form id="action-form" method="dialog"><button class="dialog-close" value="cancel" aria-label="Close">×</button><div class="eyebrow" id="dialog-eyebrow">ACCOUNT</div><h2 id="dialog-title">Add money</h2><p id="dialog-copy">Move money securely into your account.</p><input type="hidden" id="action-type"><label>Amount <span>INR</span><input id="amount" type="number" min="0.01" step="0.01" required placeholder="0.00"></label><label id="recipient-wrap" hidden>Recipient account number<input id="recipient" placeholder="FC1234567890"></label><label>Description <span>OPTIONAL</span><input id="description" maxlength="180" placeholder="What's this for?"></label><button class="primary full" id="action-submit" value="submit">Confirm</button><p class="form-error" id="form-error"></p></form></dialog>
  <dialog id="account-dialog"><form id="account-form"><button class="dialog-close" type="button" id="account-close" aria-label="Close">×</button><div class="eyebrow">NEW ACCOUNT</div><h2>Open another account</h2><p>Choose the account type you’d like to add.</p><label>Account type<select id="account-type"><option value="SAVINGS">Savings</option><option value="CHECKING">Checking</option></select></label><p class="form-error" id="account-error"></p><button class="primary full" type="submit">Create account</button></form></dialog>
  <script src="/app.js" defer></script>
</body>
</html>
